[project]
name = "food-waste"
version = "0.1.0"
description = "Food waste dataset creation and prediction"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "pillow>=10.0.0", 
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "datasets>=2.15.0",
    "huggingface-hub>=0.20.0",
    "pytest-mock"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "black>=24.3.0",
    "pytest-mock"
]

[build-system]
requires = ["setuptools>=68.2.2", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["data_processing*"]
exclude = ["tests*", "baseline*"]